version: "3.9"

services:
  graphdb:
    image: ontotext/graphdb:11.0.0
    container_name: graphdb
    ports:
      - "7201:7200"
    volumes:
      - ./graphdb-data:/opt/graphdb/home
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.dockerfile
    container_name: gutbrain-web
    environment:
      - PYTHONUNBUFFERED=1
      - GRAPHDB_ENDPOINT=http://graphdb:7200
      - GRAPHDB_REPOSITORY=gutbrainqueriesv1
      - DJANGO_ALLOWED_HOSTS=*
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8088:8000"
    depends_on:
      - graphdb
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: gutbrain-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BASE=/
      - VITE_API_BASE=/api
      - CHOKIDAR_USEPOLLING=1
    command: sh -c "npm ci && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - web
